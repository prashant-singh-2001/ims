name: CI

# Runs the full test suite on every push to main and every pull request targeting it, so a
# broken commit gets caught immediately instead of sitting undetected until someone
# eventually pushes a release tag (which is the only thing that ran tests before this
# workflow existed - see release.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # windows-latest, not ubuntu-latest: several tests (FxmlLoadSmokeTest and friends) start
    # the real JavaFX toolkit and render actual Scenes, which needs a genuine desktop
    # session - Windows GitHub-hosted runners have one, Linux runners are headless by
    # default and would need Xvfb. This also matches the app's actual scope: it only ever
    # targets Windows (NFR-03's %LOCALAPPDATA% path, DPAPI-based backup/OAuth encryption),
    # so there is no cross-platform compatibility this workflow needs to prove anyway.
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Run the test suite
        run: mvn -B -q clean test
