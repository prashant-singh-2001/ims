name: CodeQL

# Static security analysis. Runs on push/PR to catch new issues as they're introduced, plus
# a weekly scheduled scan so code that hasn't changed still gets re-checked against newly
# added CodeQL query patterns (a query added this month can find a bug in code committed
# last year).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "24 4 * * 0" # a non-round time on Sundays, to avoid every repo's scan landing on the same minute
  workflow_dispatch:

jobs:
  analyze:
    # CodeQL only needs to compile the source to build its analysis database, not run the
    # app or its JavaFX-toolkit tests - ubuntu-latest is fine here (and faster/cheaper than
    # windows-latest) even though this app only ever ships for Windows.
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      # Explicit build rather than CodeQL's generic autobuild: compile-only (no tests, no
      # packaging) is faster and this project's build has no autobuild-detection surprises
      # to worry about.
      - name: Build
        run: mvn -B -q clean compile -DskipTests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
